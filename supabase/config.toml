project_id = "bookroom"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "6MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Brute-force and spam protection for OTP sign-in (per IP, per hour unless noted).
[auth.rate_limit]
email_sent = 30
sms_sent = 30
token_verifications = 30
sign_in_sign_ups = 30
token_refresh = 150

[auth.email]
enable_signup = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
enable_confirmations = false
otp_length = 6
otp_expiry = 900

[auth.sms]
enable_signup = true
enable_confirmations = false
template = "Код BOOKROOM: {{ .Code }}"

# Local phone login without an SMS provider: these numbers accept the fixed code.
[auth.sms.test_otp]
79990000000 = "123456"
79161230001 = "123456"
